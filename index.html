<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
width:100%;
height:100vh;
overflow:hidden;
font-family:'Quicksand',sans-serif;
background:linear-gradient(to bottom,#fff,#ffd6e7);
position:relative;
}

/* Screens */

.screen{
position:absolute;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
transition:.5s;
}

.hidden{
display:none;
}

/* Bear */

.bear{
width:190px;
animation:floatBear 3s ease-in-out infinite;
filter:drop-shadow(0 0 15px rgba(255,182,193,.5));
}

@keyframes floatBear{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-15px);
}

100%{
transform:translateY(0px);
}

}

/* Headings */

h1{
font-family:'Pacifico',cursive;
font-size:40px;
color:#ff4f87;
margin-bottom:15px;
}

/* Text */

.love-text{
max-width:340px;
padding:18px;
border-radius:20px;
background:rgba(255,255,255,.5);
backdrop-filter:blur(10px);
font-size:18px;
line-height:1.7;
color:#444;
box-shadow:0 0 15px rgba(255,192,203,.3);
}

/* Buttons */

.buttons{
margin-top:25px;
position:relative;
}

button{
border:none;
padding:14px 28px;
border-radius:40px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff77aa;
color:white;
}

#no{
background:white;
color:#ff4f87;
position:absolute;
left:140px;
}

/* Hearts */

.heart{
position:absolute;
bottom:-20px;
color:pink;
animation:floatUp linear infinite;
pointer-events:none;
}

@keyframes floatUp{

0%{
transform:translateY(0);
opacity:0;
}

30%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

/* Sparkles */

.sparkle{
position:absolute;
width:6px;
height:6px;
background:pink;
border-radius:50%;
box-shadow:0 0 10px pink;
animation:sparkle 2s linear infinite;
}

@keyframes sparkle{

0%{
opacity:0;
transform:scale(.5);
}

50%{
opacity:1;
transform:scale(1.3);
}

100%{
opacity:0;
transform:scale(.5);
}

}

/* Typing */

.typing::after{
content:"|";
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0;
}
}

/* Heartbeat */

.heartbeat{
animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{

0%{transform:scale(1);}
25%{transform:scale(1.1);}
40%{transform:scale(.95);}
60%{transform:scale(1.12);}
100%{transform:scale(1);}

}

</style>
</head>

<body>

<!-- MUSIC -->

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b7b87.mp3">
</audio>

<!-- SCREEN 1 -->

<div class="screen" id="first">

<img
id="bear"
class="bear"
src="https://i.pinimg.com/originals/5e/77/1c/5e771c4f7f0d6f8ecf5a0b9d6d8d0f9d.gif"
>

<h1 id="question">
Do you love me? 💗
</h1>

<div class="buttons">
<button id="yes">Yes 💗</button>
<button id="no">No 💔</button>
</div>

</div>

<!-- SCREEN 2 -->

<div class="screen hidden" id="second">

<img
class="bear"
src="https://i.pinimg.com/originals/90/9d/8e/909d8e7f1f5f7a6cb9d7cb4e2b9f84fd.gif"
>

<h1 class="heartbeat">
I knew it 💗
</h1>

<p class="love-text">
I knew you would choose me… 🥺
</p>

<button id="next1">
Next ✨
</button>

</div>

<!-- SCREEN 3 -->

<div class="screen hidden" id="third">

<img
class="bear"
src="https://i.pinimg.com/originals/4c/f6/e3/4cf6e32df7692b9cbcb4db0f68e3d1d7.gif"
>

<h1>
Hug Hug 🤍
</h1>

<p class="love-text">
You are mine and no one else's... 💗
</p>

<button id="next2">
More 💌
</button>

</div>

<!-- SCREEN 4 -->

<div class="screen hidden" id="fourth">

<img
class="bear"
src="https://i.pinimg.com/originals/57/51/9a/57519a39f0ec8d1f5d97d4f4fef9db1d.gif"
>

<p class="love-text">
I don't think you understand what you just did... 🥺
<br><br>
You made my whole world feel lighter...
</p>

<button id="next3">
Next 🤍
</button>

</div>

<!-- FINAL -->

<div class="screen hidden" id="final">

<img
class="bear"
src="https://i.pinimg.com/originals/5f/62/42/5f6242d7e61f7dc8e9bb0fbbfcbcb1d2.gif"
>

<p id="finalText" class="love-text typing"></p>

</div>

<script>

/* ELEMENTS */

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");
const bear = document.getElementById("bear");

const first = document.getElementById("first");
const second = document.getElementById("second");
const third = document.getElementById("third");
const fourth = document.getElementById("fourth");
const final = document.getElementById("final");

const next1 = document.getElementById("next1");
const next2 = document.getElementById("next2");
const next3 = document.getElementById("next3");

const music = document.getElementById("music");

/* NO BUTTON */

const messages = [
"Are you sure...? 🥺",
"Think again... 💔",
"That hurt me a little...",
"You're breaking my tiny heart...",
"Still no...? 😭"
];

let count = 0;
let size = 18;

noBtn.onclick = () => {

question.innerText =
messages[count % messages.length];

const x =
Math.random() *
(window.innerWidth - 120);

const y =
Math.random() *
(window.innerHeight - 120);

noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

size += 5;

yesBtn.style.fontSize =
size + "px";

count++;

};

/* YES */

yesBtn.onclick = () => {

first.classList.add("hidden");

setTimeout(()=>{
second.classList.remove("hidden");
},500);

};

/* FLOW */

next1.onclick = () => {

second.classList.add("hidden");

setTimeout(()=>{
third.classList.remove("hidden");
},400);

};

next2.onclick = () => {

third.classList.add("hidden");

setTimeout(()=>{
fourth.classList.remove("hidden");
},400);

};

next3.onclick = () => {

fourth.classList.add("hidden");

setTimeout(()=>{
final.classList.remove("hidden");
typeWriter();
},400);

};

/* HEARTS */

function createHeart(){

const heart =
document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤";

heart.style.left =
Math.random()*100 + "vw";

heart.style.fontSize =
(10 + Math.random()*25) + "px";

heart.style.animationDuration =
(4 + Math.random()*4) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,300);

/* SPARKLES */

function createSparkle(){

const s =
document.createElement("div");

s.className = "sparkle";

s.style.left =
Math.random()*100 + "vw";

s.style.top =
Math.random()*100 + "vh";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},2000);

}

setInterval(createSparkle,200);

/* MUSIC */

document.body.addEventListener("click",()=>{

music.play().catch(()=>{});

},{once:true});

/* FINAL TYPING */

const finalText =
document.getElementById("finalText");

const message = `
So now you're stuck with me... okay? 🤍

You stole my heart...
but I'll let you keep it 💗

In everything you do...
I will always be there with you.
`;

let i = 0;

function typeWriter(){

if(i < message.length){

finalText.innerHTML +=
message.charAt(i);

i++;

setTimeout(typeWriter,35);

}

}

</script>

</body>
</html>
